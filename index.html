<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahul Mukherjee</title>

<style>
:root {
    --bg: #000;
    --text: #fff;
    --muted: #8a8a8a;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* NAV */
nav {
    position: fixed;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

nav a {
    margin-left: 25px;
    cursor: pointer;
    text-decoration: none;
    color: white;
}

/* SECTION SYSTEM */
.section {
    display: none;
    min-height: 100vh;
    padding: 120px 40px;
    animation: fade 0.5s ease;
}

.section.active {
    display: block;
}

@keyframes fade {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.hero h1 {
    font-size: 56px;
    margin: 0;
}

.hero p {
    color: var(--muted);
}

/* BUTTON */
.btn {
    margin-top: 20px;
    padding: 12px 24px;
    background: white;
    color: black;
    border-radius: 30px;
    text-decoration: none;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
}

.gallery img {
    width: 100%;
    border-radius: 12px;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.02);
}

/* VIDEOS */
.videos iframe {
    width: 100%;
    height: 300px;
    margin-top: 15px;
    border-radius: 12px;
}

/* LINKS */
.links a {
    display: block;
    margin: 10px 0;
    color: #2997ff;
}
</style>
</head>

<body>

<nav>
    <div>Rahul</div>
    <div>
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('resume')">Resume</a>
        <a onclick="showSection('portfolio')">Portfolio</a>
        <a onclick="showSection('links')">Links</a>
    </div>
</nav>

<!-- HOME -->
<section id="home" class="section active">
    <div class="hero">
        <h1>Rahul Mukherjee</h1>
        <p>Project Manager · Filmmaker · Photographer</p>
        <a class="btn" onclick="showSection('portfolio')">View Work</a>
    </div>
</section>

<!-- RESUME -->
<section id="resume" class="section">
    <h2>Resume</h2>
    <p>4+ years leading global traceability programs across supply chain and retail.</p>

    <a href="assets/Rahul_Mukherjee_Resume.pdf" target="_blank" class="btn">
        View Resume
    </a>
</section>

<!-- PORTFOLIO -->
<section id="portfolio" class="section">
    <h2>Photography</h2>

    <div class="gallery" id="gallery"></div>

    <a href="assets/Photoshoot_Calendar.pdf" target="_blank" class="btn">
        Photoshoot Calendar
    </a>

    <h2 style="margin-top:40px;">Films</h2>

    <div class="videos">
        <iframe src="https://www.youtube.com/embed/L_6aET73AFY"></iframe>
        <iframe src="https://www.youtube.com/embed/MTrPs2Vs6Y8"></iframe>
        <iframe src="https://www.youtube.com/embed/Mt5P1a5Fcb8"></iframe>
        <iframe src="https://www.youtube.com/embed/ARitORMdvNY"></iframe>
    </div>
</section>

<!-- LINKS -->
<section id="links" class="section">
    <h2>External Links</h2>

    <div class="links">
        <a href="https://www.youtube.com/@RahulMukherjeeDirection" target="_blank">YouTube Channel</a>
        <a href="https://www.linkedin.com/in/rahul-mukherjee1995/" target="_blank">LinkedIn</a>
    </div>
</section>

<script>
function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* LOAD EXACTLY 10 IMAGES SAFELY */
const gallery = document.getElementById("gallery");

for (let i = 1; i <= 10; i++) {
    let img = document.createElement("img");

    img.src = `assets/photo ${i}.jpg`;

    // fallback if image not found
    img.onerror = function () {
        this.style.display = "none";
    };

    gallery.appendChild(img);
}
</script>

</body>
</html>
